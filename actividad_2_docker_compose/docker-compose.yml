# =====================================================================
# FinTech Solutions S.A. - Aplicación MERN de gestión financiera
# Actividad 2: orquestación multicontenedor con Docker Compose
#
# Arquitectura (3 capas, 2 redes aisladas):
#   navegador --:80--> frontend --(frontend_net)--> backend --(backend_net)--> db
#
# Uso:  docker compose up -d --build
# =====================================================================

services:
  # ---------------------------- Capa de datos ------------------------
  db:
    build: ./db
    image: leixerlucas/fintech-db:2.0
    container_name: fintech-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db          # datos persistentes
      - mongo_config:/data/configdb  # configuración de mongod
    networks:
      - backend_net                  # solo accesible desde el backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------- Capa lógica --------------------------
  backend:
    build: ./backend
    image: leixerlucas/fintech-backend:2.0
    container_name: fintech-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/${MONGO_DB}?authSource=admin
    depends_on:
      db:
        condition: service_healthy   # espera a que MongoDB responda
    networks:
      - backend_net                  # habla con la base de datos
      - frontend_net                 # recibe peticiones de nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/todos > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------- Capa de presentación -----------------
  frontend:
    build: ./frontend
    image: leixerlucas/fintech-frontend:2.0
    container_name: fintech-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"         # único puerto publicado al exterior
    depends_on:
      backend:
        condition: service_healthy   # espera a que la API responda
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

# ------------------------------ Volúmenes ----------------------------
volumes:
  mongo_data:
    name: fintech_mongo_data
  mongo_config:
    name: fintech_mongo_config

# ------------------------------ Redes --------------------------------
networks:
  frontend_net:
    name: fintech_frontend_net
  backend_net:
    name: fintech_backend_net
    internal: true   # sin salida a Internet: la BD queda aislada
